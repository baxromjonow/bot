name: Quiz Schedule

on:
  schedule:
    - cron: '*/5 * * * 1-6'
      timezone: 'Asia/Tashkent'
  workflow_dispatch:

jobs:
  send-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Check quiz schedule
        run: |
          curl --fail \
            "https://bot-lake-zeta.vercel.app/api/cron/send?key=${{ secrets.CRON_SECRET }}"
